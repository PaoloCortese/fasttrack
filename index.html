<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Fast Track</title>
  <meta name="description" content="Dieta, digiuno 16/8 e attività: calorie prese, calorie che restano, deficit del giorno." />
  <meta name="theme-color" content="#0F5257" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Fast Track" />
  <link rel="apple-touch-icon" href="icons/icon-180x180.png" />
  <link rel="icon" type="image/png" href="icons/icon-192x192.png" />
  <link rel="manifest" href="manifest.json" />
  <style>
    :root {
      --sfondo: #F4F6F5; --carta: #FFFFFF; --testo: #15231F; --testo-2: #52625D; --linea: #DCE3E0;
      --accento: #0F5257; --accento-chiaro: #E2EFEE; --verde: #2E7D4F; --rosso: #B3261E; --rosso-chiaro: #FBE9E7; --giallo: #8A5A00; --giallo-chiaro: #FFF4D6;
      --raggio: 16px; color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --sfondo: #0E1513; --carta: #18211F; --testo: #E7EEEB; --testo-2: #9DB0A9; --linea: #2A3633;
        --accento: #6CC5C0; --accento-chiaro: #1D3432; --verde: #7BCB98; --rosso: #F2867D; --rosso-chiaro: #3A1D1B; --giallo: #F3C66B; --giallo-chiaro: #3A3020; color-scheme: dark;
      }
    }
    :root[data-theme="dark"] {
      --sfondo: #0E1513; --carta: #18211F; --testo: #E7EEEB; --testo-2: #9DB0A9; --linea: #2A3633;
      --accento: #6CC5C0; --accento-chiaro: #1D3432; --verde: #7BCB98; --rosso: #F2867D; --rosso-chiaro: #3A1D1B; --giallo: #F3C66B; --giallo-chiaro: #3A3020; color-scheme: dark;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--sfondo); color: var(--testo); font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif; -webkit-text-size-adjust: 100%; }
    button, input, textarea { font: inherit; color: inherit; }
    #app { max-width: 560px; margin: 0 auto; min-height: 100vh; }
    .testa { position: sticky; top: 0; z-index: 5; background: var(--sfondo); padding: calc(env(safe-area-inset-top) + 12px) 16px 8px; }
    .testa h1 { margin: 0; font-size: 22px; text-transform: capitalize; }
    .contenuto { padding: 4px 16px calc(env(safe-area-inset-bottom) + 96px); display: grid; gap: 12px; }
    .card { background: var(--carta); border: 1px solid var(--linea); border-radius: var(--raggio); padding: 16px; }
    .card.evidenza { border-color: var(--accento); box-shadow: 0 0 0 1px var(--accento) inset; }
    h2, h3 { margin: 0 0 8px; font-size: 17px; }
    .riga { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .riga h3 { margin: 0; }
    .piccolo { color: var(--testo-2); font-size: 14px; margin: 8px 0 0; }
    .pill { background: var(--accento-chiaro); color: var(--accento); border-radius: 999px; padding: 3px 10px; font-size: 14px; font-weight: 600; white-space: nowrap; }
    .pill.verde { color: var(--verde); }
    .budget { text-align: center; }
    .etichetta { margin: 0; color: var(--testo-2); font-size: 14px; }
    .grande { margin: 2px 0 10px; font-size: 44px; font-weight: 750; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
    .grande small { font-size: 18px; font-weight: 600; color: var(--testo-2); }
    .rosso { color: var(--rosso); }
    .barra { height: 10px; border-radius: 999px; background: var(--accento-chiaro); overflow: hidden; margin: 8px 0; }
    .barra > div { height: 100%; background: var(--accento); border-radius: 999px; transition: width .4s; }
    .barra.rossa > div { background: var(--rosso); }
    .tre { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; text-align: center; margin-top: 10px; }
    .tre b { display: block; font-size: 19px; font-variant-numeric: tabular-nums; }
    .tre span { font-size: 12.5px; color: var(--testo-2); }
    .conti { margin: 10px 0 0; padding-left: 18px; text-align: left; font-size: 14px; color: var(--testo-2); display: grid; gap: 6px; }
    .conti b { color: var(--testo); }
    .consigli { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
    .consigli li { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 12px; background: var(--accento-chiaro); }
    .consigli li.allarme { background: var(--rosso-chiaro); }
    .consigli li p { margin: 0; font-size: 15px; }
    .pasti, .diario, .semplice { list-style: none; margin: 0; padding: 0; }
    .pasti li button, .diario li button { width: 100%; display: flex; align-items: center; gap: 10px; background: none; border: 0; border-bottom: 1px solid var(--linea); padding: 12px 2px; text-align: left; cursor: pointer; min-height: 48px; }
    .pasti .ora { color: var(--testo-2); font-size: 14px; width: 44px; flex: none; font-variant-numeric: tabular-nums; }
    .pasti .desc { flex: 1; }
    .sgarro { color: var(--giallo); font-style: normal; font-size: 13px; font-weight: 600; }
    .diario li button { flex-wrap: wrap; background: var(--carta); border: 1px solid var(--linea); border-radius: 12px; margin-bottom: 8px; padding: 12px; }
    .diario .giorno { width: 72px; font-weight: 600; }
    .mini-barra { flex: 1; height: 8px; border-radius: 999px; background: var(--accento-chiaro); overflow: hidden; min-width: 60px; }
    .mini-barra span { display: block; height: 100%; background: var(--accento); }
    .mini-barra.rossa span { background: var(--rosso); }
    .diario .kcal { width: 56px; text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
    .diario .extra { width: 100%; font-size: 13px; color: var(--testo-2); padding-left: 82px; }
    .semplice li { display: flex; gap: 10px; align-items: baseline; padding: 8px 0; border-bottom: 1px solid var(--linea); }
    .semplice li span { width: 90px; } .semplice small { color: var(--testo-2); margin-left: auto; }
    .azioni { display: flex; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
    .azioni > input { flex: 1; min-width: 0; }
    button.primario, button.secondario { min-height: 48px; border-radius: 12px; padding: 0 18px; font-weight: 650; cursor: pointer; border: 1px solid var(--accento); }
    button.primario { background: var(--accento); color: var(--carta); }
    button.secondario { background: var(--carta); color: var(--accento); }
    button:disabled { opacity: .55; cursor: default; }
    .largo { width: 100%; }
    button.link { background: none; border: 0; color: var(--accento); font-weight: 600; padding: 10px 0; cursor: pointer; min-height: 44px; }
    button.link.rosso { color: var(--rosso); width: 100%; }
    input, textarea { width: 100%; border: 1px solid var(--linea); background: var(--carta); border-radius: 10px; padding: 11px 12px; min-height: 46px; font-size: 16px; }
    input:focus-visible, textarea:focus-visible, button:focus-visible { outline: 3px solid var(--accento); outline-offset: 2px; }
    input.ora { flex: 0 0 120px; }
    .campo { display: grid; gap: 4px; margin-top: 10px; font-size: 14px; color: var(--testo-2); }
    .griglia { display: grid; grid-template-columns: 1fr 1fr; gap: 0 10px; }
    .spunta { display: flex; align-items: center; gap: 10px; margin-top: 12px; min-height: 44px; }
    .spunta input { width: 22px; min-height: 22px; height: 22px; }
    .errore { color: var(--rosso); font-size: 14px; margin: 10px 0 0; }
    .avviso { background: var(--giallo-chiaro); color: var(--giallo); padding: 10px 12px; border-radius: 10px; font-size: 14px; }
    .stima { font-size: 14px; padding: 10px 12px; border-radius: 10px; background: var(--accento-chiaro); margin: 12px 0 0; }
    .stima.bassa { background: var(--giallo-chiaro); color: var(--giallo); }
    .caricamento { text-align: center; color: var(--testo-2); padding: 40px 0; }
    .schede { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; display: grid; grid-template-columns: repeat(4, 1fr); background: var(--carta); border-top: 1px solid var(--linea); padding-bottom: env(safe-area-inset-bottom); max-width: 560px; margin: 0 auto; }
    .schede button { background: none; border: 0; padding: 8px 0 10px; display: grid; justify-items: center; gap: 2px; font-size: 12.5px; color: var(--testo-2); cursor: pointer; min-height: 56px; }
    .schede button span { font-size: 20px; line-height: 1.1; }
    .schede button.attiva { color: var(--accento); font-weight: 700; }
    .velo { position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,.4); display: flex; align-items: flex-end; justify-content: center; }
    .sheet { background: var(--carta); width: 100%; max-width: 560px; max-height: 92vh; overflow: auto; border-radius: 20px 20px 0 0; padding: 16px 16px calc(env(safe-area-inset-bottom) + 20px); }
    .sheet-testa { display: flex; align-items: center; justify-content: space-between; }
    .sheet-testa h2 { margin: 0; }
    .x { background: var(--accento-chiaro); border: 0; border-radius: 50%; width: 40px; height: 40px; font-size: 22px; cursor: pointer; color: var(--testo); }
    .foto-riga { display: flex; gap: 10px; margin: 12px 0 4px; flex-wrap: wrap; }
    .mini { position: relative; width: 84px; height: 84px; }
    .mini img { width: 84px; height: 84px; object-fit: cover; border-radius: 12px; border: 1px solid var(--linea); }
    .mini button { position: absolute; top: -8px; right: -8px; width: 30px; height: 30px; border-radius: 50%; border: 0; background: var(--testo); color: var(--carta); font-size: 17px; cursor: pointer; }
    .foto-add { width: 84px; height: 84px; border-radius: 12px; border: 2px dashed var(--accento); background: var(--accento-chiaro); color: var(--accento); font-size: 26px; display: grid; place-items: center; align-content: center; gap: 0; cursor: pointer; }
    .foto-add span { font-size: 13px; font-weight: 600; }
    .grafico { width: 100%; height: auto; display: block; }
    .grafico .asse { font-size: 10px; fill: var(--testo-2); }
    .grafico .griglia-l { stroke: var(--linea); }
    .grafico .tendenza { fill: none; stroke: var(--accento); stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    .grafico .punto { fill: var(--carta); stroke: var(--testo-2); stroke-width: 1.5; }
    .legenda { font-size: 13px; color: var(--testo-2); display: flex; align-items: center; gap: 6px; margin: 6px 0 0; }
    .l-punto { width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--testo-2); display: inline-block; }
    .l-linea { width: 16px; height: 3px; background: var(--accento); display: inline-block; margin-left: 10px; border-radius: 2px; }
    .login { padding: calc(env(safe-area-inset-top) + 60px) 24px 40px; text-align: center; }
    .login form { text-align: left; margin-top: 24px; display: grid; gap: 6px; }
    .login .logo { font-size: 48px; } .login h1 { margin: 8px 0 0; } .sub, .nota { color: var(--testo-2); }
    .login button { margin-top: 14px; }
    .versione { text-align: center; color: var(--testo-2); font-size: 12px; }
  </style>
</head>
<body>
  <div id="app"><p class="caricamento">Fast Track…</p></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
